[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shm-tools"
version = "0.1.0"
description = "Structural Health Monitoring signal-processing library: load sensor CSVs, extract natural frequencies, compute mode-shape damage indicators, and visualise results."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Moath Al-Raih", email = "mo.alraih@gmail.com" }]
keywords = [
    "shm",
    "structural-health-monitoring",
    "signal-processing",
    "fdd",
    "modal-analysis",
    "damage-detection",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "mypy", "ruff"]

[project.urls]
Homepage      = "https://github.com/sbalraih-max/shm-tools"
Repository    = "https://github.com/sbalraih-max/shm-tools"
"Bug Tracker" = "https://github.com/sbalraih-max/shm-tools/issues"

[project.scripts]
shm-extract = "shm_tools.cli:main"

[tool.setuptools.packages.find]
where   = ["src"]
exclude = ["tests*", "examples*", "data*", "output*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version         = "3.10"
strict                 = true
ignore_missing_imports = true

[tool.ruff]
line-length    = 100
target-version = "py310"
